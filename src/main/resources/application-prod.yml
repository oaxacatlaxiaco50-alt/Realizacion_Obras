spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:obras_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:tlaxiaco_admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:Tlaxiaco2025_Segura!}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true

licensing:
  enabled: ${LICENSING_ENABLED:true}
  activation-key: ${ACTIVATION_KEY:}
  license-dir: ${LICENSE_DIR:/app/license}

logging:
  level:
    root: ERROR
    com.obraspublicas: INFO

security:
  jwt:
    secret-key: ${JWT_SECRET:TlaxiacoObrasPublicasSecretKey2025MunicipalSegura!}
    expiration-time: 86400000
